# =============================
# Server
# =============================
server.port=${SERVER_PORT:8080}
spring.application.name=Lab Booking API

# =============================
# Swagger
# =============================
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# =============================
# Datasource (Neon DB)
# KHÔNG hardcode trong file — dùng ENV khi deploy
# =============================
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# =============================
# JPA / Hibernate
# =============================
# ĐÃ có DB thật → KHÔNG CHO UPDATE schema
spring.jpa.hibernate.ddl-auto=none
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=false

# =============================
# Flyway
# =============================
# Flyway CHẠY LẠI SẼ PHÁ DB 
spring.flyway.enabled=false

# =============================
# Security / JWT
# =============================
app.jwt.secret=${APP_JWT_SECRET:VGhpc0lzQVNlY3JldEJhc2U2NEtleVNob3VsZExvbmdFbm91Z2g=}
app.jwt.expirationMillis=${APP_JWT_EXPIRATION_MILLIS:3600000}
app.google.clientId=${APP_GOOGLE_CLIENT_ID:}

